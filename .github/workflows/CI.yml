name: CI

# Validates BOTH dependency legs on every push/PR, so a break in either one
# surfaces here rather than at tag time in Release.yml. Nothing is published;
# the Windows leg skips packaging since the zip is only needed for a release.
#
# Release.yml is the same build with packaging + publishing bolted on. Keep the
# two in step: a change to how a platform builds belongs in both.
#
# NOTHING IS CACHED HERE, DELIBERATELY. This repo changes roughly monthly, so
# build time matters far less than knowing a clean build works. Caching also
# weakens the signal: a key can only approximate what the output depends on -
# an earlier wxWidgets cache keyed on the submodule commit would still have hit
# after a compiler upgrade or a change to the build script, validating against
# libraries built by the previous toolchain. CI now does exactly what Release
# does, from scratch, every time.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A second push supersedes the first; these builds are long and nobody needs the
# older result. Release runs are NOT cancelled (see Release.yml) - a half-done
# release is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false      # one platform failing must not hide the other's result
      matrix:
        include:
          - target: macos
            runner: macOS-26
          - target: windows
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180    # wxWidgets alone is a long pole on a cold cache

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'false'      # build.sh / build_windows.ps1 init what they need

    # ---------- macOS / iOS ----------
    - uses: maxim-lobanov/setup-xcode@v1
      if: matrix.target == 'macos'
      with:
        xcode-version: '26.4.1'
    - name: Install macOS build tools
      if: matrix.target == 'macos'
      run: |
        brew update
        brew install automake libtool cmake nasm
    - name: Build (macOS)
      if: matrix.target == 'macos'
      run: ./build.sh

    # ---------- Windows ----------
    # No -Zip: CI only needs to prove every library builds. Packaging a ~400 MB
    # bundle on every push wastes runner time and disk for an artifact that is
    # thrown away.
    - name: Build (Windows)
      if: matrix.target == 'windows'
      shell: pwsh
      run: ./build_windows.ps1 -SkipPackage
